name: Format WXspot Kotlin once
on:
  push:
    branches:
      - feat/sounding-hunt-rebuild
    paths:
      - '.github/workflows/format-feature-ui.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sounding-hunt-rebuild
          persist-credentials: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Format Kotlin with project Spotless
        working-directory: android
        run: ./gradlew :app:spotlessApply --no-daemon
      - name: Commit canonical formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src
          if ! git diff --cached --quiet; then
            git commit -m 'style(android): format captured screenshots and original map pins'
            git fetch origin feat/sounding-hunt-rebuild
            git rebase origin/feat/sounding-hunt-rebuild
            git push origin HEAD:feat/sounding-hunt-rebuild
          fi
