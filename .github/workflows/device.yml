name: Sounding Hunt device acceptance
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: default
          - api: 36
            target: google_apis
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: wxspot
          POSTGRES_PASSWORD: wxspot
          POSTGRES_DB: wxspot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wxspot" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://wxspot:wxspot@localhost:5432/wxspot
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e 'backend[test]'
      - run: alembic upgrade head
        working-directory: backend
      - name: Start IGRA worker and API
        working-directory: backend
        run: |
          python -m wxspot.workers.weather > /tmp/wxspot-worker.log 2>&1 &
          uvicorn wxspot.main:app --host 0.0.0.0 --port 8000 > /tmp/wxspot-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/wxspot-api.log
          exit 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Prepare isolated acceptance signing
        run: bash .github/scripts/prepare-signing.sh
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sounding Hunt daily, result persistence, and practice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            bash .github/scripts/upgrade.sh
            bash .github/scripts/device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sounding-Hunt-device-acceptance-API-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            /tmp/wxspot-api.log
            /tmp/wxspot-worker.log
            /tmp/wxspot-device.log
            /tmp/wxspot-hunt-screenshots/
