name: Signed beta APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Increment above every previously distributed beta
        required: true
        default: "5"
      version_name:
        description: Beta display version
        required: true
        default: "0.2.0-beta.3"
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    env:
      WXSPOT_KEYSTORE_PASSWORD: ${{ secrets.WXSPOT_KEYSTORE_PASSWORD }}
      WXSPOT_KEY_ALIAS: ${{ secrets.WXSPOT_KEY_ALIAS }}
      WXSPOT_KEY_PASSWORD: ${{ secrets.WXSPOT_KEY_PASSWORD }}
      WXSPOT_VERSION_CODE: ${{ inputs.version_code }}
      WXSPOT_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0'
      - name: Load retained private signing key
        env:
          WXSPOT_KEYSTORE_BASE64: ${{ secrets.WXSPOT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in WXSPOT_KEYSTORE_BASE64 WXSPOT_KEYSTORE_PASSWORD WXSPOT_KEY_ALIAS WXSPOT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required signing secret: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$WXSPOT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wxspot-beta.jks"
          echo "WXSPOT_KEYSTORE_PATH=$RUNNER_TEMP/wxspot-beta.jks" >> "$GITHUB_ENV"
      - name: Validate and build signed production-endpoint beta
        run: |
          set -euo pipefail
          if [[ ! "$WXSPOT_VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$WXSPOT_VERSION_CODE" -le 4 ]; then
            echo "Beta version code must be an integer greater than distributed version 4."
            exit 1
          fi
          ./gradlew :app:spotlessCheck :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            -Pwxspot.beta=true -Pwxspot.versionCode="$WXSPOT_VERSION_CODE" -Pwxspot.versionName="$WXSPOT_VERSION_NAME" --no-daemon
          mkdir -p app/build/outputs/beta
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/beta/WxSpot-beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/beta/WxSpot-beta.apk \
            | tee app/build/outputs/beta/certificate.txt
          expected=$(openssl x509 -in ../docs/BETA_SIGNING_CERTIFICATE.pem -outform DER | sha256sum | cut -d ' ' -f 1)
          grep -Fxq "Signer #1 certificate SHA-256 digest: $expected" app/build/outputs/beta/certificate.txt
          sha256sum app/build/outputs/beta/WxSpot-beta.apk > app/build/outputs/beta/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WxSpot-signed-beta-${{ inputs.version_code }}
          path: android/app/build/outputs/beta/
          retention-days: 90
      - name: Remove runner signing copy
        if: always()
        run: rm -f "$RUNNER_TEMP/wxspot-beta.jks"
