[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wxspot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "fastapi-users[sqlalchemy]==15.0.5",
  "sqlalchemy==2.0.54", "psycopg[binary]==3.3.6", "geoalchemy2==0.20.0",
  "alembic==1.20.0", "httpx==0.28.1", "defusedxml==0.7.1",
  "shapely==2.1.2", "pydantic-settings==2.15.0",
  "boto3==1.43.108", "pillow==12.3.0", "uvicorn[standard]==0.54.0",
  "eccodes==2.43.0", "eccodeslib==2.43.0", "eckitlib==1.32.4.11",
  "fckitlib==0.14.1.11", "metpy==1.7.1", "pyproj==3.7.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["wxspot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
