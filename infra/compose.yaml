services:
  postgis:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: wxspot
      POSTGRES_PASSWORD: wxspot
      POSTGRES_DB: wxspot
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wxspot"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ..
    environment:
      DATABASE_URL: postgresql+psycopg://wxspot:wxspot@postgis:5432/wxspot
      MEDIA_DIR: /app/media
    ports: ["8000:8000"]
    volumes: ["media:/app/media"]
    depends_on:
      postgis:
        condition: service_healthy
volumes:
  postgres:
  media:
